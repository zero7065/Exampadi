<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#emeraldGradient)" opacity="0.15"/>
  
  <!-- Letter E (geometric, bold) -->
  <path d="M16 12 L44 12 L44 16 L20 16 L20 28 L40 28 L40 32 L20 32 L20 44 L44 44 L44 48 L16 48 Z" 
        fill="#0f172a" stroke="url(#emeraldGradient)" stroke-width="1"/>
  
  <!-- Stylized Brain inside the E -->
  <g filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="M22 21 
             C20 20, 18 20, 18 22
             C18 25, 20 27, 22 26
             C24 25, 25 23, 25 20
             C25 18, 24 16, 22 16
             C20 16, 19 17, 20 19" 
          fill="none" stroke="url(#emeraldGradient)" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Right hemisphere -->
    <path d="M38 21 
             C40 20, 42 20, 42 22
             C42 25, 40 27, 38 26
             C36 25, 35 23, 35 20
             C35 18, 36 16, 38 16
             C40 16, 41 17, 40 19" 
          fill="none" stroke="url(#emeraldGradient)" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Neural pathways / AI analysis lines (gold) -->
    <g stroke="url(#goldGradient)" stroke-width="0.8" stroke-linecap="round" opacity="0.9">
      <path d="M25 22 L39 22" stroke-dasharray="3,2"/>
      <path d="M25 26 L39 26" stroke-dasharray="3,2"/>
      <path d="M29 18 L29 30" stroke-dasharray="2,3" opacity="0.7"/>
      <path d="M35 18 L35 30" stroke-dasharray="2,3" opacity="0.7"/>
      <path d="M23 22 L27 19" opacity="0.6"/>
      <path d="M41 22 L37 19" opacity="0.6"/>
      <path d="M23 26 L27 29" opacity="0.6"/>
      <path d="M41 26 L37 29" opacity="0.6"/>
    </g>
    
    <!-- Center connecting bridge -->
    <path d="M30 22 C32 22, 32 26, 34 26" 
          fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Small neural nodes -->
    <circle cx="27" cy="22" r="1.5" fill="url(#goldGradient)" opacity="0.9"/>
    <circle cx="37" cy="22" r="1.5" fill="url(#goldGradient)" opacity="0.9"/>
    <circle cx="32" cy="24" r="2" fill="url(#goldGradient)" opacity="0.8"/>
  </g>
</svg>