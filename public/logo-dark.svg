<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emeraldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="goldWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="goldSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset dx="1" dy="2" result="offsetBlur"/>
      <feSpecularLighting surfaceScale="3" specularConstant="0.5" specularExponent="10" lighting-color="#ffffff" result="specOut">
        <fePointLight x="64" y="30" z="80"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
      <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- Background circle (dark mode) -->
  <circle cx="64" cy="64" r="60" fill="#0b1a14" stroke="url(#emeraldDeep)" stroke-width="2"/>
  
  <!-- Inner highlight ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#emeraldGlow)" stroke-width="1" opacity="0.5"/>

  <!-- Letter E -->
  <g filter="url(#innerGlow)">
    <path d="M34 22 L84 22 L84 30 L42 30 L42 54 L80 54 L80 62 L42 62 L42 86 L84 86 L84 94 L34 94 Z" 
          fill="#f0fdf4" stroke="url(#emeraldGlow)" stroke-width="1.2"/>
  </g>

  <!-- Brain hemispheres -->
  <g filter="url(#outerGlow)">
    <path d="M46 40 C42 38, 38 38, 38 42 C38 48, 42 52, 46 50 C50 48, 52 44, 52 38 C52 34, 50 30, 46 30 C42 30, 40 32, 42 36" 
          fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M78 40 C82 38, 86 38, 86 42 C86 48, 82 52, 78 50 C74 48, 72 44, 72 38 C72 34, 74 30, 78 30 C82 30, 84 32, 82 36" 
          fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <path d="M58 41 C61 41, 61 45, 64 45 C67 45, 67 41, 70 41" 
          fill="none" stroke="url(#goldWarm)" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <g stroke="url(#goldWarm)" stroke-width="1" stroke-linecap="round" opacity="0.9">
      <path d="M50 40 L74 40" stroke-dasharray="3,2"/>
      <path d="M50 48 L74 48" stroke-dasharray="3,2"/>
      <path d="M56 34 L56 54" stroke-dasharray="2,3" opacity="0.7"/>
      <path d="M68 34 L68 54" stroke-dasharray="2,3" opacity="0.7"/>
      <path d="M46 41 L52 35" opacity="0.6"/>
      <path d="M80 41 L74 35" opacity="0.6"/>
      <path d="M46 47 L52 53" opacity="0.6"/>
      <path d="M80 47 L74 53" opacity="0.6"/>
    </g>
    <circle cx="52" cy="40" r="2.5" fill="url(#goldWarm)" opacity="1" filter="url(#outerGlow)"/>
    <circle cx="72" cy="40" r="2.5" fill="url(#goldWarm)" opacity="1" filter="url(#outerGlow)"/>
    <circle cx="64" cy="44" r="3" fill="url(#goldWarm)" opacity="0.95" filter="url(#outerGlow)"/>
    <circle cx="58" cy="36" r="1.8" fill="url(#goldSubtle)" opacity="0.8"/>
    <circle cx="70" cy="36" r="1.8" fill="url(#goldSubtle)" opacity="0.8"/>
    <circle cx="58" cy="50" r="1.8" fill="url(#goldSubtle)" opacity="0.8"/>
    <circle cx="70" cy="50" r="1.8" fill="url(#goldSubtle)" opacity="0.8"/>
  </g>

  <!-- Particles -->
  <g opacity="0.5" fill="url(#goldWarm)">
    <circle cx="40" cy="30" r="1"/>
    <circle cx="86" cy="30" r="1"/>
    <circle cx="38" cy="60" r="0.8"/>
    <circle cx="88" cy="60" r="0.8"/>
    <circle cx="42" cy="88" r="1"/>
    <circle cx="84" cy="88" r="1"/>
  </g>
</svg>