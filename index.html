  <!-- Pre-paint theme (prevents light-to-dark flash) -->
  <script>
    try {
      var t = localStorage.getItem("ep-theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "dark" ? "#07090C" : "#F5F8F7");
    } catch (e) {}
